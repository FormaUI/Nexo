name: CI

# The gate on every push but main's, which promotion fast-forwards to a commit that passed on candidate, and on every pull request, on a clean Linux machine of a fixed release, so a new image never changes a result unasked. A push to candidate runs the full gate, which packs both packages and verifies them as consumers install them, and keeps the packages for the release to publish.
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes the older run; every commit on a branch keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each action is pinned to the commit of the release named in its comment.
jobs:
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    env:
      CANDIDATE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/candidate' }}
    steps:
      # The whole history, since the documents link to commits a record of the past names, which the link test reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      # The SDK nuget/global.json pins, which the build requires exactly.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: nuget/global.json

      - name: Gate
        if: env.CANDIDATE != 'true'
        shell: pwsh
        run: ./build.ps1

      - name: Full gate
        if: env.CANDIDATE == 'true'
        shell: pwsh
        run: ./build.ps1 -Full

      # The packages the full gate built and verified, under the name the release's checks read them by, kept as long as GitHub allows.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.CANDIDATE == 'true'
        with:
          name: packages
          path: |
            artifacts/*.tgz
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 90
